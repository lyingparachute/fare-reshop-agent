<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 944 322" width="944" height="322" role="img" aria-labelledby="t d">
<title id="t">Rule check of every sample offer</title>
<desc id="d">Each row is one offer for a sample booking. Each column is one hard rule, marked pass or fail. The last columns give the nominal saving and the result. QX7T2A and RT5K8B pass every rule and are rebooked. LM9P4C, ZC3N1D and HB6W9E are kept: two offers fail rules, one offer passes every rule but its saving is below the minimum.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0b0b0b}
.sec{fill:#52514e}
.grid{stroke:#d6d5d0}
.base{stroke:#52514e}
.muted{fill:#b9b8b2}
.blue{fill:#2a78d6}
.glyph{fill:#ffffff;font-weight:700}
.pass{fill:#0ca30c}
.fail{fill:#d03b3b}
.min{stroke:#eb6834}
.mintext{fill:#b8461a}
@media (prefers-color-scheme: dark){
 text{fill:#f0efec}
 .sec{fill:#c3c2b7}
 .grid{stroke:#3a3a37}
 .base{stroke:#c3c2b7}
 .muted{fill:#5d5c58}
 .blue{fill:#3987e5}
 .glyph{fill:#ffffff}
 .min{stroke:#d95926}
 .mintext{fill:#f08c62}
}
</style>
